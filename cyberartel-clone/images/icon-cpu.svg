<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E60606;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g transform="translate(64, 64)">
    <!-- Процессор -->
    <rect x="-30" y="-30" width="60" height="60" fill="url(#cpuGrad)" rx="5"/>
    <rect x="-25" y="-25" width="50" height="50" fill="#000000" opacity="0.5" rx="3"/>

    <!-- Контакты -->
    <rect x="-45" y="-20" width="10" height="5" fill="#FFFFFF"/>
    <rect x="-45" y="-10" width="10" height="5" fill="#FFFFFF"/>
    <rect x="-45" y="0" width="10" height="5" fill="#FFFFFF"/>
    <rect x="-45" y="10" width="10" height="5" fill="#FFFFFF"/>

    <rect x="35" y="-20" width="10" height="5" fill="#FFFFFF"/>
    <rect x="35" y="-10" width="10" height="5" fill="#FFFFFF"/>
    <rect x="35" y="0" width="10" height="5" fill="#FFFFFF"/>
    <rect x="35" y="10" width="10" height="5" fill="#FFFFFF"/>

    <rect x="-20" y="-45" width="5" height="10" fill="#FFFFFF"/>
    <rect x="-10" y="-45" width="5" height="10" fill="#FFFFFF"/>
    <rect x="0" y="-45" width="5" height="10" fill="#FFFFFF"/>
    <rect x="10" y="-45" width="5" height="10" fill="#FFFFFF"/>

    <rect x="-20" y="35" width="5" height="10" fill="#FFFFFF"/>
    <rect x="-10" y="35" width="5" height="10" fill="#FFFFFF"/>
    <rect x="0" y="35" width="5" height="10" fill="#FFFFFF"/>
    <rect x="10" y="35" width="5" height="10" fill="#FFFFFF"/>

    <!-- Логотип центр -->
    <circle cx="0" cy="0" r="8" fill="#E60606"/>
  </g>
</svg>