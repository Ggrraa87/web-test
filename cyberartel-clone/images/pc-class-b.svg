<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#232323"/>
  <g transform="translate(200, 200)">
    <!-- Корпус ПК -->
    <rect x="-60" y="-100" width="120" height="180" fill="#171717" stroke="#E60606" stroke-width="3" rx="10"/>
    <!-- Передняя панель -->
    <rect x="-50" y="-90" width="100" height="30" fill="#000000" opacity="0.5"/>
    <!-- Вентиляция -->
    <line x1="-40" y1="-40" x2="40" y2="-40" stroke="#E60606" stroke-width="2"/>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#E60606" stroke-width="2"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#E60606" stroke-width="2"/>
    <!-- Кнопка питания -->
    <circle cx="0" cy="40" r="8" fill="#E60606"/>
    <text x="0" y="120" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">B-CLASS</text>
  </g>
</svg>