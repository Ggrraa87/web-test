<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E60606;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g transform="translate(64, 64)">
    <!-- Спидометр -->
    <circle cx="0" cy="10" r="45" fill="none" stroke="url(#speedGrad)" stroke-width="8" stroke-dasharray="70 212"/>
    <circle cx="0" cy="10" r="35" fill="#000000" opacity="0.5"/>

    <!-- Стрелка -->
    <line x1="0" y1="10" x2="25" y2="-20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="5" fill="#E60606"/>

    <!-- Деления -->
    <line x1="-35" y1="10" x2="-40" y2="10" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="35" y1="10" x2="40" y2="10" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-35" x2="0" y2="-40" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>