server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Скрываем версию Nginx
    server_tokens off;

    # Gzip сжатие для лучшей производительности
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Основная локация
    location / {
        try_files $uri $uri/ /index.html;

        # Ограничение размера запроса (защита от больших загрузок)
        client_max_body_size 10M;
    }

    # Кеширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Запрет доступа к скрытым файлам (.git, .env и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== ЗАГОЛОВКИ БЕЗОПАСНОСТИ ==========

    # Защита от кликджекинга (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Защита от MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS защита (для старых браузеров)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy (контроль передачи referrer)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (защита от XSS и инъекций)
    # Разрешаем скрипты и стили только с нашего домена
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Permissions Policy (ограничение API браузера)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=()" always;

    # HSTS (только для HTTPS - закомментировано для HTTP)
    # Раскомментируйте при использовании SSL
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ========== ДОПОЛНИТЕЛЬНАЯ ЗАЩИТА ==========

    # Ограничение HTTP методов (разрешены только GET, HEAD, POST)
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
